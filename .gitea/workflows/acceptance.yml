name: Acceptance Tests

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: tf-acceptance-tests
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    env:
      API_ENDPOINT: ${{ vars.API_ENDPOINT }}
      PORTAL_URL: ${{ vars.PORTAL_URL }}
      GOPRIVATE: go.frostmoln.internal/*
      GONOSUMCHECK: go.frostmoln.internal/*
      GOINSECURE: go.frostmoln.internal,git.sm.internal
      GIT_SSL_NO_VERIFY: "true"
      GIT_CONFIG_GLOBAL: /tmp/.gitconfig-ci
    steps:
      # `workflow_dispatch` accepts ANY ref: Gitea's dispatch API takes
      # `ref` as a required parameter and does not restrict it, so a
      # branch can be dispatched here and its run bodies execute. This
      # refuses any ref that is not main or a pull-request ref.
      #
      # ACCIDENT CONTAINMENT, not an authorization control. Gitea
      # resolves the workflow definition from the DISPATCHED ref, so
      # anyone who can push can push a copy without this step, and every
      # ref that already exists still carries the unguarded file. What it
      # buys is that a dispatch of the wrong branch gets a loud refusal
      # instead of a run.
      #
      # An ALLOW-LIST on the ref alone, and deliberately NOT a test on
      # `github.event_name`: an unresolved or changed event value fails
      # OPEN, and that value has already silently changed meaning once
      # here (2026-07-31, ~20 PRs auto-merged untested). Every legitimate
      # trigger lands on one of the three refs below -- push and schedule
      # on `refs/heads/main`, pull_request on `refs/pull/<n>/head`, both
      # verified against real runs -- so an empty or unexpected ref falls
      # to `*)` and refuses. Literal arms, so no metacharacter in the ref
      # lands in the pattern.
      #
      # A failing STEP rather than a job-level `if:`, so a refusal is RED
      # rather than a silent skip -- Gitea counts a skipped required check
      # as SATISFIED (ADR-0010). POSIX sh. The ref is deliberately NOT
      # echoed: stdout is scanned for `::command::` directives.
      - name: Restrict dispatch to main
        id: dispatch-guard
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -eu
          case "${DISPATCH_REF}" in
            refs/heads/main|refs/pull/*/head|refs/pull/*/merge) ;;
            *)
              echo "::error::refusing to run: ref is neither refs/heads/main nor a pull-request ref"
              exit 1
              ;;
          esac

      - uses: actions/checkout@v7
      # Go is baked into the anchor-runner image (GOTOOLCHAIN=auto matches
      # go.mod), so no actions/setup-go. The provider now imports
      # go.frostmoln.internal/oidc, so `go test` needs the private-module rewrite
      # (ci-runner token, git.sm.internal — the k3s dind runners NXDOMAIN on `gitea`).
      - name: Configure Go private modules
        env:
          GITEA_TOKEN: ${{ secrets.CI_GITEA_TOKEN }}
        run: |  # pragma: allowlist secret
          printf '[url "https://ci-runner:%s@git.sm.internal/frostmoln/"]\n  insteadOf = http://go.frostmoln.internal/\n  insteadOf = https://go.frostmoln.internal/\n  insteadOf = http://git.sm.internal/frostmoln/\n  insteadOf = https://git.sm.internal/frostmoln/\n' "$GITEA_TOKEN" > /tmp/.gitconfig-ci

      - name: Create test user and API key
        run: |
          set -euo pipefail
          RUN_ID="${{ gitea.run_id }}"
          EMAIL="tf-acctest-${RUN_ID}@test.nl.cloud"

          echo "Registering test user: ${EMAIL}"
          RESP=$(curl -s --fail-with-body -X POST "${API_ENDPOINT}/auth/register" \
            -H "Content-Type: application/json" \
            -H "Origin: ${PORTAL_URL}" \
            -d "{\"email\":\"${EMAIL}\",\"password\":\"AccTest!Secure2026#\",\"name\":\"TF AccTest ${RUN_ID}\"}")

          BEARER=$(echo "$RESP" | jq -r '.accessToken')
          if [ -z "$BEARER" ] || [ "$BEARER" = "null" ]; then
            echo "::error::Registration failed. Response: ${RESP}"
            exit 1
          fi
          echo "Test user registered successfully"

          echo "Creating API key"
          KEY_RESP=$(curl -s --fail-with-body -X POST "${API_ENDPOINT}/api-keys" \
            -H "Authorization: Bearer ${BEARER}" \
            -H "Content-Type: application/json" \
            -H "Origin: ${PORTAL_URL}" \
            -d '{"name":"tf-acctest-key","scopes":["compute:read","compute:write","storage:read","storage:write","network:read","network:write","billing:read","secrets:read","secrets:write","kubernetes:read","kubernetes:write"]}')

          API_KEY=$(echo "$KEY_RESP" | jq -r '.key')
          if [ -z "$API_KEY" ] || [ "$API_KEY" = "null" ]; then
            echo "::error::API key creation failed. Response: ${KEY_RESP}"
            exit 1
          fi
          echo "API key created successfully"

          echo "FROSTMOLN_API_KEY=${API_KEY}" >> $GITHUB_ENV
          echo "FROSTMOLN_API_ENDPOINT=${PORTAL_URL}/api" >> $GITHUB_ENV
          echo "TEST_BEARER_TOKEN=${BEARER}" >> $GITHUB_ENV

      # The managed-K8s tests (frostmoln_kubernetes_*) always skip here: they
      # need an explicit FROSTMOLN_TEST_KUBERNETES=1 opt-in (they create real,
      # billed clusters) AND the `kubernetes` entitlement, which the fresh
      # per-run tenant lacks (ADR-0038). The run recipe for an entitled tenant
      # is in internal/resource/kubernetes_cluster/resource_acc_test.go —
      # never opt in HERE without also raising this job's 30m go-test timeout.
      - name: Run acceptance tests
        run: TF_ACC=1 go test -v -timeout 30m -count=1 ./internal/...
        env:
          FROSTMOLN_TEST_IMAGE_NAME: "Ubuntu 24.04"
          FROSTMOLN_TEST_FLAVOR_NAME: "gp1.small"

      - name: Cleanup test user
        # `always()` alone also runs after the dispatch guard refuses,
        # which would exercise this step on a rejected ref.
        if: always() && steps.dispatch-guard.outcome == 'success'
        run: |
          curl -sf -X DELETE "${API_ENDPOINT}/me" \
            -H "Authorization: Bearer ${TEST_BEARER_TOKEN}" \
            -H "Origin: ${PORTAL_URL}" || echo "Cleanup: user may already be deleted"
