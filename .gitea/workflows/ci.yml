name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Reusable Go test + coverage (build:false — the provider ships binaries via
  # goreleaser, no OCI image). Keep name: CI + job id `test` so the required
  # context stays `CI / test (pull_request)`; version-pin (ADR-0048), Renovate bumps.
  test:
    uses: frostmoln/workflows/.gitea/workflows/go-build.yml@v0.9.3
    with:
      build: false
    secrets:
      CI_GITEA_TOKEN: ${{ secrets.CI_GITEA_TOKEN }}
      GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
